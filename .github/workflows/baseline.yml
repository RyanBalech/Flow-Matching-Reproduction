name: 2D reproduction baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Train and evaluate
        run: python scripts/run_2d_baseline.py --steps 2000 --samples 1000 --seed 0
      - name: Print result
        if: always()
        run: test -f results/eight_gaussians_baseline.json && cat results/eight_gaussians_baseline.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-matching-2d-baseline
          path: results/eight_gaussians_baseline.json
          if-no-files-found: warn
