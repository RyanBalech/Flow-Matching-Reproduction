name: Multi-seed solver study

on:
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Run five-seed matched-NFE study
        run: python scripts/run_multiseed_solver_study.py
      - name: Print result
        run: cat results/eight_gaussians_solver_multiseed.json
      - uses: actions/upload-artifact@v4
        with:
          name: flow-matching-solver-multiseed
          path: results/eight_gaussians_solver_multiseed.json
